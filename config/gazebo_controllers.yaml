# Publish joint_states (保持不变)
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# 【新增】机械臂控制器
# 这里使用位置控制器，因为 MoveIt 默认发送位置指令
arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
  constraints:
    goal_time: 10
    stopped_velocity_tolerance: 0.1
    joint1: {trajectory: 1.0, goal: 0.5}  # 放宽到 1.0 弧度（约57度）
    joint2: {trajectory: 1.0, goal: 0.5}
    joint3: {trajectory: 1.0, goal: 0.5}
    joint4: {trajectory: 1.0, goal: 0.5}
    joint5: {trajectory: 1.0, goal: 0.5}
    joint6: {trajectory: 1.0, goal: 0.5}


