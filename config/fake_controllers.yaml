controller_list:
  - name: fake_base_controller
    type: $(arg fake_execution_type)
    joints:
      - world_car
  - name: fake_arm_controller
    type: $(arg fake_execution_type)
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
  - name: fake_whole_controller
    type: $(arg fake_execution_type)
    joints:
      - world_car
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
initial:  # Define initial robot poses per group
  - group: whole
    pose: init